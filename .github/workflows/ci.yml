name: Reproducible simulation CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all 16 identities
        run: python -m unittest discover -s simulation -p 'test_*.py' -v
      - name: Produce deterministic outputs
        run: python simulation/chipless.py --bits 1111 --seed 2024 --noise-db 0.8 --trials 5 --out results
      - name: Archive synthetic results
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-chipless-reproduction
          path: results/
